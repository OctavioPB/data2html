[project]
name = "data2html"
version = "0.1.0"
description = "EDA, SQL querying and visualization with live HTML reports"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "duckdb>=1.5",
  "sqlglot>=30",
  "pyarrow>=17",
  "pyyaml>=6",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",        # OIDC (discovery, JWKS, token endpoint)
  "joserfc>=1.7,<2",     # id_token validation (BSD-3, ADR 0010)
  "ruamel.yaml>=0.18",   # saving content keeps hand-written comments (MIT)
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "boto3>=1.35"]  # httpx2: starlette TestClient
teradata = ["teradatasql>=20"]
dynamodb = ["boto3>=1.35"]  # Apache-2.0; only the ingest CLI/worker needs it
ai = ["anthropic>=0.40", "boto3>=1.35"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"data2html.render" = ["templates/*.html", "templates/*.svg", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: integration with the development Postgres (skipped if there is no server)",
  "mysql: integration with the development MySQL (skipped if there is no server)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/data2html/locales/*.py" = ["E501"]  # one message per line, however long

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["data2html.spec.*", "data2html.semantic.*", "data2html.sqlgen.*"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "boto3", "boto3.*", "botocore", "botocore.*", "ruamel", "ruamel.*"]
ignore_missing_imports = true
