# Registro de conexiones. Solo NOMBRES de variables de entorno, nunca secretos.
# Copia a config/sources.yaml (ignorado por git) o apunta D2H_SOURCES_FILE a otro archivo.
sources:
  postgres_dev:
    type: postgres
    host: localhost
    port: 5432
    database: d2h
    user: d2h_reader
    password_env: PG_DEV_PASSWORD   # el valor vive en el entorno (.env), nunca aquí
    mode: directquery
    schemas: [public]               # esquemas visibles en el catálogo
    connect_timeout_s: 5
  # Teradata llega en la Fase 7; hoy un tipo distinto de postgres es un error de validación.
