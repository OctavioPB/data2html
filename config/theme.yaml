# Viewer theme: OPB brand (ADR 0013). Categorical palette in fixed order (series 1, 2, …), never cycled,
# derived from the brand and validated with the dataviz skill (scripts/validate_palette.js) against the
# white card surface: lightness band, chroma floor, colour-blind separation and 3:1 contrast all pass.
# The brand's semantic colours (green, red, orange) are reserved for states, never series.
# The viewer is light only; `dark` repeats `light` because the theme format requires both.
font: "'Plus Jakarta Sans', sans-serif"
currency: MXN                   # ISO 4217 code for `format: currency` measures
palette:
  light: ["#2D69AE", "#B8871F", "#7C4DBD", "#E05080", "#3E9BD6"]
  dark:  ["#2D69AE", "#B8871F", "#7C4DBD", "#E05080", "#3E9BD6"]
