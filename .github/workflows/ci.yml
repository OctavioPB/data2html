name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:  # same as docker-compose.yml; development-only credentials
        image: postgres:16
        env:
          POSTGRES_DB: d2h
          POSTGRES_USER: d2h
          POSTGRES_PASSWORD: d2h
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U d2h" --health-interval 2s --health-timeout 2s --health-retries 15
      mysql:  # same as docker-compose.yml; development-only credentials
        image: mysql:8.4
        env:
          MYSQL_DATABASE: d2h
          MYSQL_ROOT_PASSWORD: d2h-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pd2h-root" --health-interval 3s --health-timeout 3s
          --health-retries 30
    env:
      PG_DEV_PASSWORD: d2h
      MYSQL_DEV_PASSWORD: d2h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Seed Postgres
        run: psql -h localhost -U d2h -d d2h -v ON_ERROR_STOP=1 -f ../dev/seed.sql
        env:
          PGPASSWORD: d2h
      - name: Seed MySQL
        run: mysql -h 127.0.0.1 -uroot -pd2h-root d2h < ../dev/seed_mysql.sql
      - run: python -m data2html.devtools install-extensions
      - run: ruff check .
      - run: mypy src
      # includes the spec.schema.json and openapi.json drift tests, and the Postgres ones
      - run: pytest -q -rs

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: TS types in sync with openapi.json
        run: npm run gen:api && git diff --exit-code -- src/generated/api.ts
      - run: npm run lint
      - run: npm run build
