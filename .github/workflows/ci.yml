name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:  # mismo que docker-compose.yml; credenciales solo de desarrollo
        image: postgres:16
        env:
          POSTGRES_DB: d2h
          POSTGRES_USER: d2h
          POSTGRES_PASSWORD: d2h
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U d2h" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      PG_DEV_PASSWORD: d2h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Semilla de Postgres
        run: psql -h localhost -U d2h -d d2h -v ON_ERROR_STOP=1 -f ../dev/seed.sql
        env:
          PGPASSWORD: d2h
      - run: python -m data2html.devtools install-extensions
      - run: ruff check .
      - run: mypy src
      # incluye los tests de deriva de spec.schema.json y openapi.json, y los de Postgres
      - run: pytest -q -rs

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - name: Tipos TS en sincronía con openapi.json
        run: npm run gen:api && git diff --exit-code -- src/generated/api.ts
      - run: npm run lint
      - run: npm run build
